<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Rock-paper-scisssors: Odinproject</title>
  </head>
  <body>
    <div class="container">
      <div class="game-div">
        <div class="score-div">
          <span class="human-score">0</span> :
          <span class="computer-score">0</span>
        </div>
        <div class="winner-announcement">
          <h1 class="winner"></h1>
        </div>
        <div class="selected-options">
          <span class="human-option"></span>
          <span>vs</span>
          <span class="computer-option"></span>
        </div>
        <div>
          <button>rock</button><button>paper</button><button>scissors</button>
        </div>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
